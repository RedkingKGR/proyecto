<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .container {
        background: white;
        padding: 50px;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 500px;
    }
    
    h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 2.5em;
    }
    
    p {
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1em;
    }
    
    .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }
    
    a {
        display: inline-block;
        padding: 12px 30px;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: all 0.3s ease;
        font-size: 1em;
    }
    
    .btn-login {
        background: #667eea;
        color: white;
    }
    
    .btn-login:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-registro {
        background: #764ba2;
        color: white;
    }
    
    .btn-registro:hover {
        background: #63398b;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
    }
</style>
</head>
<body>
<div class="container">
    <h1>🌐 Mi Web</h1>
    <p>Bienvenido a nuestra plataforma. Por favor, inicia sesión o crea una cuenta.</p>
    <div class="button-group">
        <a href="/login" class="btn-login">Ir al Login</a>
        <a href="/registro" class="btn-registro">Registrarse</a>
    </div>
</div>
</body>
</html>
